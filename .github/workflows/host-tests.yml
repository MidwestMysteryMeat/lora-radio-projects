name: Host tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run host logic tests
        run: python -B tests/test_coord_roundtrip.py
      - name: Compile every Python source file
        run: >-
          python -B -m compileall -q
          pico_lora_locator
          meshtastic_hiker_compass
          ble_lora_tracker
          tests
